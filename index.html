<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>kyara.glb viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js";

    // === scene ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    // === camera ===
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.3, 3);

    // === renderer ===
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // === lights ===
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(2, 4, 2);
    scene.add(dirLight);

    // === controls (ユーザー操作は有効のまま。不要なら後で教えてください) ===
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // === load model ===
    const loader = new GLTFLoader();
    let model = null;

    loader.load("kyara.glb", gltf => {
      model = gltf.scene;

      // 中央に移動 & 標準スケール調整
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      model.position.sub(center);
      const maxAxis = Math.max(size.x, size.y, size.z);
      model.scale.setScalar(2 / maxAxis);

      scene.add(model);
    });

    // === 自動回転（120秒で360°） ===
    const rotationSpeed = (2 * Math.PI) / 120; // rad/sec
    const clock = new THREE.Clock();

    // === resize ===
    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // === loop ===
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (model) model.rotation.y += rotationSpeed * dt;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
